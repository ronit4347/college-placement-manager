databases:
  - name: college-placement-manager-db
    databaseName: college_placement_manager
    user: placement_app
    plan: free
    region: singapore
    ipAllowList: []

services:
  - type: web
    name: college-placement-manager-ronith-api
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: college-placement-manager-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: FRONTEND_URL
        value: https://college-placement-manager-ronith.onrender.com
      - key: AI_PROVIDER
        value: gemini
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-3.8-flash
      - key: AI_REQUEST_TIMEOUT_SECONDS
        value: "25"
      - key: AI_MAX_RESUME_CHARACTERS
        value: "30000"
      - key: RESUME_UPLOAD_DIR
        value: /opt/render/project/src/uploads/resumes
      - key: MAX_RESUME_SIZE_BYTES
        value: "5242880"
      - key: DEMO_SEED_ENABLED
        value: "false"

  - type: web
    name: college-placement-manager-ronith
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://college-placement-manager-ronith-api.onrender.com
